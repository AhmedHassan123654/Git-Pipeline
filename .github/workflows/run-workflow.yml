name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect and Build Project
        run: |
          echo "جاري اكتشاف نوع المشروع والبناء..."
          
          if [ -f "pom.xml" ]; then
            echo "مشروع Maven - جاري البناء..."
            mvn clean compile -q
          elif [ -f "package.json" ]; then
            echo "مشروع Node.js - جاري البناء..."
            npm install
            if grep -q "\"build\"" package.json; then
              npm run build
            fi
          elif [ -f "requirements.txt" ]; then
            echo "مشروع Python - جاري تثبيت المتطلبات..."
            pip install -r requirements.txt
          else
            echo "مشروع بسيط - التحقق من الملفات الأساسية..."
            ls -la
          fi
          
          echo "✅ البناء اكتمل بنجاح!"

      - name: Trigger Project B
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/teamtester60-code/Full-Test-Case/dispatches \
            -d '{"event_type":"project-a-trigger"}'