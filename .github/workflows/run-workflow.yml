name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core 3.1
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '3.1.x'

      - name: Setup Java for E2E Tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify .NET Installation
        run: |
          echo "🔍 Checking .NET versions..."
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Build Frontend Application
        run: |
          echo "🏗️ Building Frontend Application..."
          Set-Location "${{ env.FRONTEND_DIR }}"
          
          # Install Angular CLI and dependencies
          npm install -g @angular/cli@12.2.17
          npm install --legacy-peer-deps --force
          
          # Build the frontend
          ng build --configuration=production --source-map=false
          
          # Verify build output
          if (Test-Path "dist") {
            echo "✅ Frontend built successfully!"
            Get-ChildItem "dist" -Recurse | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            echo "❌ Frontend build failed - no dist directory created"
            exit 1
          }

      - name: Start Backend Server
        run: |
          echo "🚀 Starting Backend Server..."
          Set-Location "${{ env.BACKEND_DIR }}"
          echo "Current directory: $(Get-Location)"
          
          # Verify .NET 3.1 is available for the backend
          echo "Checking .NET runtime for backend..."
          dotnet --list-runtimes | findstr "3.1"
          
          # Check for backend files
          $backendFiles = Get-ChildItem -File
          echo "Available backend files:"
          $backendFiles | Select-Object Name, Length | Format-Table -AutoSize
          
          # Start the backend
          echo "Starting backend application..."
          Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "POS.Web.dll --urls=http://localhost:5000" -RedirectStandardOutput "backend_output.log" -RedirectStandardError "backend_error.log"
          
          # Wait for backend to start
          for ($i = 1; $i -le 40; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                echo "✅ Backend is responding on port 5000!"
                break
              }
            } catch {
              if ($i -eq 1) {
                echo "Backend starting... (this may take a while for .NET 3.1)"
              }
              if ($i % 10 -eq 0) {
                echo "Still waiting for backend... ($i/40)"
                # Check if process is running
                $dotnetProcess = Get-Process -Name "dotnet" -ErrorAction SilentlyContinue
                if ($dotnetProcess) {
                  echo "Dotnet process is running..."
                }
              }
              Start-Sleep -Seconds 2
            }
            if ($i -eq 40) {
              echo "❌ Backend failed to start within 80 seconds"
              if (Test-Path "backend_error.log") {
                echo "Backend error log:"
                Get-Content "backend_error.log"
              }
              exit 1
            }
          }

      - name: Serve Frontend from Build Output
        run: |
          echo "🌐 Serving Frontend from build output..."
          Set-Location "${{ env.FRONTEND_DIR }}"
          echo "Current directory: $(Get-Location)"
          
          # Verify dist directory exists after build
          if (!(Test-Path "dist")) {
            echo "❌ Frontend dist directory not found after build!"
            echo "Available directories:"
            Get-ChildItem -Directory | Select-Object Name | Format-Table -AutoSize
            exit 1
          }
          
          # Find the actual distribution folder (could be dist/project-name)
          $distPath = "dist"
          $subDirs = Get-ChildItem "dist" -Directory
          if ($subDirs.Count -eq 1) {
            $distPath = "dist/$($subDirs[0].Name)"
            echo "Using distribution folder: $distPath"
          }
          
          # Install and use a simple HTTP server to serve the built files
          npm install -g http-server
          echo "Starting HTTP server for frontend on port 4200..."
          Start-Process -NoNewWindow -FilePath "http-server" -ArgumentList "$distPath -p 4200 -a 0.0.0.0 -c-1" -RedirectStandardOutput "frontend_output.log"
          
          # Wait for frontend to start
          for ($i = 1; $i -le 20; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:4200" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                echo "✅ Frontend is responding on port 4200!"
                break
              }
            } catch {
              if ($i -eq 1) {
                echo "Frontend starting..."
              }
              Start-Sleep -Seconds 2
            }
          }

      - name: Verify Services Running
        run: |
          echo "📊 Final Service Status Check:"
          echo "Backend: http://localhost:5000"
          echo "Frontend: http://localhost:4200"
          
          netstat -an | findstr ":5000" && echo "✅ Backend port 5000 is listening" || echo "❌ Backend port not listening"
          netstat -an | findstr ":4200" && echo "✅ Frontend port 4200 is listening" || echo "❌ Frontend port not listening"

      - name: Clone E2E Test Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:4200
        run: |
          echo "🧪 Starting E2E Tests..."
          echo "Backend URL: $env:BACKEND_BASE_URL"
          echo "Frontend URL: $env:FRONTEND_BASE_URL"
          
          # Test service connectivity before running tests
          try {
            $backendTest = Invoke-WebRequest -Uri "$env:BACKEND_BASE_URL" -UseBasicParsing -TimeoutSec 5
            echo "✅ Backend is accessible"
          } catch {
            echo "⚠️ Backend may not be fully ready: $($_.Exception.Message)"
          }
          
          try {
            $frontendTest = Invoke-WebRequest -Uri "$env:FRONTEND_BASE_URL" -UseBasicParsing -TimeoutSec 5
            echo "✅ Frontend is accessible"
          } catch {
            echo "⚠️ Frontend may not be fully ready: $($_.Exception.Message)"
          }
          
          # Run E2E tests
          echo "Running E2E tests..."
          mvn clean test -DbrowserType="chrome" -DexecutionType="localHeadless" -Dmaven.test.failure.ignore=true

      - name: Upload Test Results and Logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-test-results
          path: |
            C:\Users\pc\IdeaProjects\FirstProjectFERP\test-output\reports.html
            C:\Users\pc\IdeaProjects\FirstProjectFERP\test-output\screenshots
            ${{ env.BACKEND_DIR }}/backend_output.log
            ${{ env.BACKEND_DIR }}/backend_error.log
            ${{ env.FRONTEND_DIR }}/frontend_output.log
            ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 30

      - name: Final Status Report
        if: always()
        run: |
          echo "🎯 E2E Test Pipeline Execution Completed"
          echo "📁 Test reports uploaded as artifact: e2e-test-results"