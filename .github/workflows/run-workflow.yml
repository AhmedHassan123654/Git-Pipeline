name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:56740
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl xvfb git netcat-openbsd libnss3 libatk-bridge2.0-0 libgtk-3-0
          sudo apt-get install -y libssl-dev libkrb5-dev
          sudo apt-get install -y ca-certificates

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup .NET Core 3.1 with Dependencies
        uses: actions/setup-dotnet@v3
        with:
            dotnet-version: |
              3.1.x
            include-prerelease: false

      - name: Install Angular CLI globally
        run: |
          npm install -g @angular/cli@21
          ng version

      - name: Verify .NET Installation
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Verify Directories Structure
        run: |
          echo "=== Checking Project Structure ==="
          find . -name "package.json" -type f | head -10
          echo "Backend directory:"
          ls -la "${{ env.BACKEND_DIR }}" || echo "Backend directory not found"
          echo "Frontend directory:"
          ls -la "${{ env.FRONTEND_DIR }}" || echo "Frontend directory not found"
          if [ -d "${{ env.FRONTEND_DIR }}" ]; then
            echo "Frontend package.json:"
            cat "${{ env.FRONTEND_DIR }}/package.json" | grep -A 10 -B 5 "scripts"
          fi

      - name: Start Backend API
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
            echo "Starting backend..."
            echo "Current directory: $(pwd)"
            echo "Files in directory:"
            ls -la
            
            # فحص إذا كان التطبيق مبني لنظام Linux
            echo "Checking application type:"
            file POS.Web.dll 2>/dev/null || echo "Cannot check file type"
            
            # تشغيل الـ Backend مع معالجة أفضل للأخطاء
            echo "Starting backend process..."
            dotnet POS.Web.dll --urls=${{ env.BACKEND_URL }} > backend.log 2>&1 &
            BACKEND_PID=$!
            echo "Backend process started with PID: $BACKEND_PID"
            
            # انتظار حتى يكون Backend جاهزاً
            echo "Waiting for backend to start..."
            for i in {1..30}; do
              # فحص إذا كانت العملية لا تزال تعمل
              if ! kill -0 $BACKEND_PID 2>/dev/null; then
                echo "Backend process died! Check logs below:"
                cat backend.log
                exit 1
              fi
            
              # فحص إذا كان الـ Backend يستمع على البورت
              if netstat -tuln | grep -q ":56740"; then
                echo "Backend is listening on port 56740!"
                break
              fi
            
              echo "Waiting for backend... ($i/30)"
              sleep 2
            done
            
            # فحص إضافي باستخدام curl
            for i in {1..10}; do
              if curl -f -s ${{ env.BACKEND_URL }} >/dev/null 2>&1; then
                echo "Backend is fully ready and responding to HTTP requests!"
                break
              fi
              echo "Waiting for HTTP response... ($i/10)"
              sleep 2
            done
            
            # فحص نهائي
            if curl -f -s ${{ env.BACKEND_URL }} >/dev/null 2>&1; then
              echo "✅ Backend is running successfully!"
              echo "Backend logs (first 50 lines):"
              head -50 backend.log
            else
              echo "❌ Backend failed to start properly"
              echo "Full backend logs:"
              cat backend.log
              echo "Network status:"
              netstat -tuln | grep ":56740" || echo "Port 56740 not found in netstat"
              echo "Process status:"
              ps aux | grep dotnet
              exit 1
            fi
      

      - name: Install Frontend Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Installing frontend dependencies..."
          npm ci --legacy-peer-deps --no-audit
          echo "Dependencies installed successfully"

      - name: Build Angular Application
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Building Angular application..."
          # حلول متعددة لضمان نجاح البناء
          if [ -f "./node_modules/.bin/ng" ]; then
            echo "Using local ng binary"
            chmod +x ./node_modules/.bin/ng
            ./node_modules/.bin/ng build --configuration production --output-path=dist/POS
          elif command -v ng &> /dev/null; then
            echo "Using global ng command"
            ng build --configuration production --output-path=dist/POS
          else
            echo "Using npx with angular cli"
            npx -p @angular/cli@21 ng build --configuration production --output-path=dist/POS
          fi
          echo "Angular build completed successfully"

      - name: Install Serve and Start Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Installing serve globally..."
          npm install -g serve
          
          echo "Starting frontend server..."
          nohup serve -s ./dist/POS -l 4200 > frontend.log 2>&1 &
          echo "Frontend process started with PID: $!"
          
          # انتظار حتى يكون Frontend جاهزاً
          echo "Waiting for frontend to start..."
          for i in {1..30}; do
            if curl -f -s ${{ env.FRONTEND_URL }} >/dev/null 2>&1; then
              echo "Frontend is ready after $((i*2)) seconds!"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          
          # فحص إذا كان Frontend يعمل
          if ! curl -f -s ${{ env.FRONTEND_URL }} >/dev/null 2>&1; then
            echo "Frontend failed to start. Logs:"
            cat frontend.log
            echo "Checking serve process..."
            ps aux | grep serve
            exit 1
          else
            echo "Frontend is running successfully!"
          fi

      - name: Verify Services Are Running
        run: |
          echo "=== Verifying All Services ==="
          echo "Backend check:"
          curl -f -s ${{ env.BACKEND_URL }} || echo "Backend not accessible via HTTP"
          nc -z localhost 56740 && echo "Backend port is open" || echo "Backend port not open"
          
          echo "Frontend check:"
          curl -f -s ${{ env.FRONTEND_URL }} && echo "Frontend is accessible" || echo "Frontend not accessible"
          
          echo "Process list:"
          ps aux | grep -E "(dotnet|serve)" | grep -v grep

      - name: Checkout E2E Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB
          echo "E2E project structure:"
          ls -la projectB/

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: ${{ env.BACKEND_URL }}
          FRONTEND_BASE_URL: ${{ env.FRONTEND_URL }}
        run: |
          echo "Running E2E tests with:"
          echo "Backend: $BACKEND_BASE_URL"
          echo "Frontend: $FRONTEND_BASE_URL"
          
          mvn clean test -DbrowserType="chrome" -DexecutionType="localHeadless" -Dmaven.test.failure.ignore=true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v5
        with:
          name: regression-reports
          path: |
            projectB/test-output/reports/**/*
            projectB/target/surefire-reports/*.*
          retention-days: 30

      - name: Upload Application Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: application-logs
          path: |
            ${{ env.BACKEND_DIR }}/backend.log
            ${{ env.FRONTEND_DIR }}/frontend.log
          retention-days: 30

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: angular-build
          path: ${{ env.FRONTEND_DIR }}/dist/**
          retention-days: 7