name: CI Pipeline

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Check Secret
        run: |
          echo "🔍 Checking if PAT secret is available..."
          if [ -n "${{ secrets.PROJECT_B_PAT }}" ]; then
            echo "✅ PAT secret is available"
          else
            echo "❌ PAT secret is MISSING"
          fi

      - name: Trigger Project B
        run: |
          echo "🚀 Attempting to trigger Project B..."
          response=$(curl -s -L -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROJECT_B_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/teamtester60-code/Full-Test-Case/dispatches \
            -d '{"event_type":"project-a-trigger"}' \
            -o response_body.txt)
          
          echo "Response Code: $response"
          echo "Response Body:"
          cat response_body.txt