name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Build Output Structure
        run: |
          echo "🔍 Checking build output structure..."
          echo "Backend directory content:"
          Get-ChildItem $env:BACKEND_DIR -Recurse | Select-Object Name, Length | Format-Table
          echo "Frontend directory content:"
          Get-ChildItem $env:FRONTEND_DIR -Recurse | Select-Object Name, Length | Format-Table

      - name: Setup Java for E2E Tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Start Backend Server from Build Output
        run: |
            echo "🚀 Starting Backend from build output..."
            cd ${{ env.BACKEND_DIR }}
            
            # Check for common backend executable patterns
            $backendFiles = @("POS.Web.dll", "POS.Web.exe", "app.dll", "app.exe", "*.dll", "*.exe")
            $foundFile = $null
            
            foreach ($file in $backendFiles) {
              if (Test-Path $file) {
                $foundFile = (Get-ChildItem $file).Name
                echo "✅ Found backend file: $foundFile"
                break
              }
            }
            
            if (!$foundFile) {
              echo "❌ No backend executable found. Available files:"
              Get-ChildItem -Recurse | Format-Table Name, Length
              exit 1
            }
            
            # Try different ways to start the backend
            echo "Starting backend with file: $foundFile"
            
            if ($foundFile -like "*.dll") {
              # .NET Core application
              Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "$foundFile --urls=http://localhost:5000" -RedirectStandardOutput "backend_output.log" -RedirectStandardError "backend_error.log"
            } elseif ($foundFile -like "*.exe") {
              # Windows executable
              Start-Process -NoNewWindow -FilePath ".\$foundFile" -ArgumentList "--urls=http://localhost:5000" -RedirectStandardOutput "backend_output.log" -RedirectStandardError "backend_error.log"
            }
            
            # Wait for backend to start
            for ($i = 1; $i -le 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://localhost:5000" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  echo "✅ Backend is responding on port 5000!"
                  break
                }
              } catch {
                if ($i -eq 1) {
                  echo "Backend starting..."
                }
                Start-Sleep -Seconds 2
              }
              if ($i -eq 30) {
                echo "❌ Backend failed to start within 60 seconds"
                if (Test-Path "backend_error.log") {
                  echo "Backend error log:"
                  Get-Content "backend_error.log"
                }
              }
            }

      - name: Serve Frontend from Build Output
        working-directory: $env:FRONTEND_DIR
        run: |
          echo "🌐 Serving Frontend from build output..."
          
          # Check for built frontend files
          $distDirs = @("dist", "build", "output", "wwwroot")
          $foundDist = $null
          
          foreach ($dir in $distDirs) {
            if (Test-Path $dir) {
              $foundDist = $dir
              echo "✅ Found frontend build directory: $foundDist"
              break
            }
          }
          
          if (!$foundDist) {
            echo "❌ No frontend build directory found. Available directories:"
            Get-ChildItem -Directory | Format-Table Name
            exit 1
          }
          
          # Install and use a simple HTTP server to serve the built files
          npm install -g http-server
          echo "Starting HTTP server for frontend on port 4200..."
          Start-Process -NoNewWindow -FilePath "http-server" -ArgumentList "$foundDist -p 4200 -a 0.0.0.0" -RedirectStandardOutput "frontend_output.log"

      - name: Wait for Services to Be Ready
        run: |
          echo "⏳ Waiting for services to be fully ready..."
          Start-Sleep -Seconds 10
          
          echo "📊 Service Status:"
          echo "Backend: http://localhost:5000"
          echo "Frontend: http://localhost:4200"
          
          netstat -an | findstr ":5000" && echo "✅ Backend port 5000 is listening" || echo "❌ Backend port not listening"
          netstat -an | findstr ":4200" && echo "✅ Frontend port 4200 is listening" || echo "❌ Frontend port not listening"

      - name: Clone E2E Test Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:4200
        run: |
          echo "🧪 Starting E2E Tests..."
          echo "Backend URL: $env:BACKEND_BASE_URL"
          echo "Frontend URL: $env:FRONTEND_BASE_URL"
          
          # Test service connectivity before running tests
          try {
            $backendTest = Invoke-WebRequest -Uri "$env:BACKEND_BASE_URL" -UseBasicParsing -TimeoutSec 5
            echo "✅ Backend is accessible"
          } catch {
            echo "❌ Backend is not accessible: $($_.Exception.Message)"
          }
          
          try {
            $frontendTest = Invoke-WebRequest -Uri "$env:FRONTEND_BASE_URL" -UseBasicParsing -TimeoutSec 5
            echo "✅ Frontend is accessible"
          } catch {
            echo "❌ Frontend is not accessible: $($_.Exception.Message)"
          }
          
          # Run E2E tests
          mvn clean test -DbrowserType="chrome" -DexecutionType="localHeadless" -Dmaven.test.failure.ignore=true

      - name: Upload Test Results and Logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-test-results
          path: |
            projectB/target/surefire-reports/**/*
            $env:BACKEND_DIR/backend_output.log
            $env:BACKEND_DIR/backend_error.log
            $env:FRONTEND_DIR/frontend_output.log
          retention-days: 30

      - name: Final Status Report
        if: always()
        run: |
          echo "🎯 E2E Test Pipeline Execution Completed"
          echo "📁 Test reports uploaded as artifact: e2e-test-results"