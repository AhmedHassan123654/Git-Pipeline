name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core 3.1
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '3.1.x'

      - name: Setup Java for E2E Tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Frontend with Fixes
        run: |
          echo "🏗️ Building Frontend Application with fixes..."
          Set-Location "${{ env.FRONTEND_DIR }}"
          
          # Install Angular CLI and fix dependencies
          npm install -g @angular/cli@12.2.17
          
          # Clean installation
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          
          # Install with legacy peer deps to resolve conflicts
          npm install --legacy-peer-deps --force
          
          # Fix missing dependencies
          npm install font-awesome@4.7.0 --save --legacy-peer-deps
          npm install @angular/material@12.2.13 --save --legacy-peer-deps
          npm install @fortawesome/fontawesome-free@5.15.4 --save --legacy-peer-deps
          npm install @syncfusion/ej2-base@20.4.52 --save --legacy-peer-deps
          npm install angular2-draggable@2.3.2 --save --legacy-peer-deps
          npm install typescript@~4.9.0 --save-dev --legacy-peer-deps
          
          # Fix SCSS import issues
          if (Test-Path src/custom-theme.scss) {
            (Get-Content src/custom-theme.scss) -replace '@import ''~@angular/material/theming'';', '@import ''@angular/material/theming'';' | Set-Content src/custom-theme.scss
          }
          
          if (Test-Path src/assets/css/globalCss.css) {
            (Get-Content src/assets/css/globalCss.css) -replace '~font-awesome/css/font-awesome.min.css', 'font-awesome/css/font-awesome.min.css' | Set-Content src/assets/css/globalCss.css
          }
          
          # Try building with different configurations
          echo "Attempting to build frontend..."
          ng build --configuration=production --source-map=false 2>&1 | Tee-Object build.log
          
          # If production build fails, try development
          if (!(Test-Path "dist")) {
            echo "Production build failed, trying development build..."
            ng build --configuration=development 2>&1 | Tee-Object -Append build.log
          }
          
          # If development fails, try basic build
          if (!(Test-Path "dist")) {
            echo "Development build failed, trying basic build..."
            ng build 2>&1 | Tee-Object -Append build.log
          }
          
          # Final check
          if (Test-Path "dist") {
            echo "✅ Frontend built successfully!"
            Get-ChildItem "dist" -Recurse | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            echo "❌ All build attempts failed"
            Get-Content build.log
            exit 1
          }

      - name: Start Backend Server
        run: |
          echo "🚀 Starting Backend Server..."
          Set-Location "${{ env.BACKEND_DIR }}"
          
          # Start the backend
          Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "POS.Web.dll --urls=http://localhost:5000" -RedirectStandardOutput "backend_output.log" -RedirectStandardError "backend_error.log"
          
          # Wait for backend to start
          for ($i = 1; $i -le 40; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                echo "✅ Backend is responding on port 5000!"
                break
              }
            } catch {
              if ($i -eq 1) { echo "Backend starting..." }
              Start-Sleep -Seconds 2
            }
            if ($i -eq 40) {
              echo "❌ Backend failed to start within 80 seconds"
              if (Test-Path "backend_error.log") { Get-Content "backend_error.log" }
              exit 1
            }
          }

      - name: Serve Frontend
        run: |
          echo "🌐 Serving Frontend..."
          Set-Location "${{ env.FRONTEND_DIR }}"
          
          if (!(Test-Path "dist")) {
            echo "❌ Frontend dist directory not found!"
            exit 1
          }
          
          # Find the actual distribution folder
          $distPath = "dist"
          $subDirs = Get-ChildItem "dist" -Directory
          if ($subDirs.Count -eq 1) {
            $distPath = "dist/$($subDirs[0].Name)"
            echo "Using distribution folder: $distPath"
          }
          
          # Install and serve the frontend
          npm install -g http-server
          Start-Process -NoNewWindow -FilePath "http-server" -ArgumentList "$distPath -p 4200 -a 0.0.0.0 -c-1" -RedirectStandardOutput "frontend_output.log"
          
          # Wait for frontend to start
          for ($i = 1; $i -le 20; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:4200" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                echo "✅ Frontend is responding on port 4200!"
                break
              }
            } catch {
              if ($i -eq 1) { echo "Frontend starting..." }
              Start-Sleep -Seconds 2
            }
          }

      - name: Clone E2E Test Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB

      - name: Run E2E Tests with HTML Reports
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:4200
        run: |
          echo "🧪 Starting E2E Tests..."
          
          # Generate HTML reports with Maven Surefire
          mvn clean test -DbrowserType="chrome" -DexecutionType="localHeadless" -Dmaven.test.failure.ignore=true
          
          # Generate additional HTML reports if using ExtentReports or similar
          mvn site -DgenerateReports=true

      - name: Upload HTML Test Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-html-reports
          path: |
           "test-output/reports/*.html"
          retention-days: 30

      - name: Upload Test Logs and Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-logs
          path: |
            ${{ env.BACKEND_DIR }}/backend_output.log
            ${{ env.BACKEND_DIR }}/backend_error.log
            ${{ env.FRONTEND_DIR }}/frontend_output.log
            ${{ env.FRONTEND_DIR }}/build.log
          retention-days: 30

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 30

      - name: Create Summary HTML Report
        if: always()
        run: |
          echo "📊 Creating Test Summary..."
          Set-Location projectB
          
          # Create a simple HTML summary report
          $htmlReport = @"
          <!DOCTYPE html>
          <html>
          <head>
              <title>E2E Test Results Summary</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .success { color: green; }
                  .failure { color: red; }
                  .warning { color: orange; }
                  .summary { background: #f5f5f5; padding: 20px; border-radius: 5px; }
              </style>
          </head>
          <body>
              <h1>🎯 E2E Test Results Summary</h1>
              <div class="summary">
                  <h2>Test Execution Details</h2>
                  <p><strong>Backend URL:</strong> ${{ env.BACKEND_URL }}</p>
                  <p><strong>Frontend URL:</strong> ${{ env.FRONTEND_URL }}</p>
                  <p><strong>Execution Time:</strong> $(Get-Date)</p>
                  <p><strong>Status:</strong> <span class="success">Completed</span></p>
              </div>
              <h2>📁 Available Reports</h2>
              <ul>
                  <li><a href="surefire-reports/index.html">Surefire Test Reports</a></li>
                  <li><a href="site/surefire-report.html">Maven Site Report</a></li>
                  <li>Backend Logs</li>
                  <li>Frontend Logs</li>
              </ul>
              <p>Check the Artifacts section for detailed reports and logs.</p>
          </body>
          </html>
          "@
          
          $htmlReport | Out-File -FilePath "test-summary.html" -Encoding UTF8
          echo "✅ HTML summary report created"

      - name: Upload Summary Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: summary-report
          path: "test-output/reports/*.html"
          retention-days: 30

      - name: Final Status
        if: always()
        run: |
          echo "🎯 Pipeline Execution Completed"
          echo "📊 HTML Reports Available in Artifacts:"
          echo "   - e2e-html-reports (Detailed test reports)"
          echo "   - summary-report (Executive summary)"
          echo "   - test-logs (Log files)"
          echo "   - frontend-build (Built frontend files)"