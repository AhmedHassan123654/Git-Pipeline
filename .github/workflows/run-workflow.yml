name: CI Pipeline

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Project B
        run: | 
          repo="teamtester60-code/Full-Test-Case"
          echo "🚀 Attempting to trigger Project B..."
         curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            "https://api.github.com/repos/$repo/dispatches" \
            -d '{"event_type":"project-b-trigger"}'
            echo "✅ Trigger request sent to Project B."
