name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:56740  # ✅ تصحيح المنفذ إلى 56740
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Windows)
        run: |
          # تثبيت المتطلبات على Windows
          echo "Installing Chrome..."
          choco install googlechrome -y --no-progress || echo "Chrome installation failed or already installed"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            3.1.x
            6.0.x

      - name: Install Angular CLI globally
        run: |
          npm install -g @angular/cli@21
          ng version

      - name: Verify Directories Structure
        run: |
          echo "=== Checking Project Structure ==="
          echo "Backend directory:"
          dir "${{ env.BACKEND_DIR }}" || echo "Backend directory not found"
          echo "Frontend directory:"
          dir "${{ env.FRONTEND_DIR }}" || echo "Frontend directory not found"
          
          # فحص إضافي للتأكد من الملفات
          echo "Checking Backend files:"
          dir "${{ env.BACKEND_DIR }}\*.dll" | findstr "POS.Web.dll" || echo "POS.Web.dll not found"

      - name: Start Backend API on Port 56740
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "Starting backend on Windows..."
          echo "Current directory: $(pwd)"
          echo "Backend files:"
          dir *.dll | findstr "POS.Web"

          # قتل أي عملية dotnet سابقة
          taskkill /f /im dotnet.exe 2>$null
          Start-Sleep -Seconds 3

          # تشغيل الـ Backend مع إجبار المنفذ 56740
          echo "Starting backend on port 56740..."
          $env:ASPNETCORE_URLS = "http://localhost:56740"
          Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "POS.Web.dll" -RedirectStandardOutput "backend.log" -RedirectStandardError "backend_error.log"
          
          echo "Backend process started with ASPNETCORE_URLS=$env:ASPNETCORE_URLS"

          # انتظار حتى يكون Backend جاهزاً على المنفذ 56740
          echo "Waiting for backend to start on port 56740..."
          $success = $false
          for ($i = 1; $i -le 40; $i++) {
            # فحص باستخدام netstat أولاً
            $listening = netstat -an | findstr ":56740" | findstr "LISTENING"
            if ($listening) {
              echo "✅ Backend is listening on port 56740!"
              $success = $true
              break
            }

            # فحص HTTP
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:56740" -UseBasicParsing -TimeoutSec 2 -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                echo "✅ Backend responded on port 56740!"
                $success = $true
                break
              }
            } catch {
              # تجاهل الأخطاء ومحاولة مرة أخرى
            }

            echo "Waiting for backend... ($i/40)"
            Start-Sleep -Seconds 2
          }

          # فحص نهائي - ✅ تصحيح: فحص المنفذ 56740 وليس 5000
          $listening = netstat -an | findstr ":56740" | findstr "LISTENING"
          if ($listening -or $success) {
            echo "✅ Backend is running successfully on port 56740!"
            echo "Backend logs (first 15 lines):"
            Get-Content "backend.log" -Head 15
            echo "Backend error logs (first 5 lines):"
            Get-Content "backend_error.log" -Head 5
          } else {
            echo "❌ Backend failed to start on port 56740"
            echo "Checking all listening ports:"
            netstat -an | findstr "LISTENING" | findstr ":56740 :5000"
            echo "Backend logs:"
            Get-Content "backend.log" -ErrorAction SilentlyContinue
            echo "Backend error logs:"
            Get-Content "backend_error.log" -ErrorAction SilentlyContinue
            echo "Process list:"
            Get-Process -Name "dotnet" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Install Frontend Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Installing frontend dependencies..."
          npm ci --legacy-peer-deps --no-audit
          echo "Dependencies installed successfully"

      - name: Build Angular Application
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Building Angular application..."
          ng build --configuration production --output-path=dist/POS
          echo "Angular build completed successfully"

      - name: Install Serve and Start Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Installing serve globally..."
          npm install -g serve
          
          echo "Starting frontend server..."
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "serve", "-s", "dist/POS", "-l", "4200" -RedirectStandardOutput "frontend.log" -RedirectStandardError "frontend_error.log"
          
          echo "Frontend process started..."
          
          # انتظار حتى يكون Frontend جاهزاً
          echo "Waiting for frontend to start..."
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "${{ env.FRONTEND_URL }}" -UseBasicParsing -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                echo "✅ Frontend is ready after $($i*2) seconds!"
                break
              }
            } catch {
              # تجاهل الأخطاء ومحاولة مرة أخرى
            }
            echo "Waiting for frontend... ($i/30)"
            Start-Sleep -Seconds 2
          }
          
          # فحص إذا كان Frontend يعمل
          try {
            $response = Invoke-WebRequest -Uri "${{ env.FRONTEND_URL }}" -UseBasicParsing
            echo "✅ Frontend is running successfully!"
          } catch {
            echo "❌ Frontend failed to start"
            echo "Frontend logs:"
            Get-Content "frontend.log" -ErrorAction SilentlyContinue
            echo "Frontend error logs:"
            Get-Content "frontend_error.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Verify Both Services
        run: |
          echo "=== Final Service Verification ==="
          echo "Checking Backend on http://localhost:56740:"
          try {
            $backendResponse = Invoke-WebRequest -Uri "http://localhost:56740" -UseBasicParsing
            echo "✅ Backend: HTTP 200 OK"
          } catch {
            echo "❌ Backend: Not accessible"
          }
          
          echo "Checking Frontend on ${{ env.FRONTEND_URL }}:"
          try {
            $frontendResponse = Invoke-WebRequest -Uri "${{ env.FRONTEND_URL }}" -UseBasicParsing
            echo "✅ Frontend: HTTP 200 OK"
          } catch {
            echo "❌ Frontend: Not accessible"
          }
          
          echo "Network status:"
          netstat -an | findstr ":56740 :4200" | findstr "LISTENING"

      - name: Checkout E2E Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB
          echo "E2E project structure:"
          dir projectB

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:56740  # ✅ تأكيد استخدام المنفذ 56740
          FRONTEND_BASE_URL: ${{ env.FRONTEND_URL }}
        run: |
          echo "Running E2E tests with:"
          echo "Backend: $env:BACKEND_BASE_URL"
          echo "Frontend: $env:FRONTEND_BASE_URL"
          
          mvn clean test -DbrowserType="chrome" -DexecutionType="local" -Dmaven.test.failure.ignore=true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v5
        with:
          name: regression-reports
          path: |
            projectB/test-output/reports/**/*
            projectB/target/surefire-reports/*.*
          retention-days: 30

      - name: Upload Application Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: application-logs
          path: |
            ${{ env.BACKEND_DIR }}/backend.log
            ${{ env.BACKEND_DIR }}/backend_error.log
            ${{ env.FRONTEND_DIR }}/frontend.log
            ${{ env.FRONTEND_DIR }}/frontend_error.log
          retention-days: 30