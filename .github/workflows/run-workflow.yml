name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
            node-version: '18.20.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            3.1.x
            6.0.x

      - name: Install Angular CLI
        run: npm install -g @angular/cli@12.2.17

      - name: Start Backend API
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "Starting backend..."
          taskkill /f /im dotnet.exe 2>$null
          Start-Sleep -Seconds 2
          Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "POS.Web.dll" -RedirectStandardOutput "backend.log" -RedirectStandardError "backend_error.log"
          
          for ($i = 1; $i -le 30; $i++) {
            $listening = netstat -an | findstr ":5000" | findstr "LISTENING"
            if ($listening) {
              echo "✅ Backend is listening on port 5000!"
              break
            }
            echo "Waiting for backend... ($i/30)"
            Start-Sleep -Seconds 2
          }

      - name: Build Frontend Application
        run: |
            cd POS-19-10-2025/POS-Front-19-10-2025
            npm install --legacy-peer-deps --force
            ng build --configuration=production --source-map=false

      - name: Start Frontend Server (Port 4200)
        run: |
               cd POS-19-10-2025/POS-Front-19-10-2025
              echo "Starting frontend server on port 4200..."
              start /B ng serve --port 4200 --host 0.0.0.0
                timeout 60

      - name: Verify Services Running
        run: |
          echo "Checking running services:"
          echo "- Backend: http://localhost:5000"
          echo "- Frontend: http://localhost:4200"
          netstat -an | findstr ":5000" && echo "✅ Backend is running" || echo "❌ Backend not available"
          netstat -an | findstr ":4200" && echo "✅ Frontend is running" || echo "❌ Frontend not available"    

      - name: Checkout E2E Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:4200
        run: |
          echo "Starting E2E tests..."
          mvn clean test -DbrowserType="chrome" -DexecutionType="localHeadless" -Dmaven.test.failure.ignore=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            projectB/test-output/reports/**/*
            ${{ env.BACKEND_DIR }}/backend.log
            ${{ env.FRONTEND_DIR }}/dist/POS/
          retention-days: 30