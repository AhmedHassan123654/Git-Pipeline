name: Full POS CI + E2E Regression Test

on:
  push:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: windows-latest

    env:
      BACKEND_DIR: POS-19-10-2025/POS-BackPublish
      FRONTEND_DIR: POS-19-10-2025/POS-Front-19-10-2025
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:4200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            3.1.x
            6.0.x

      - name: Install Angular CLI globally
        run: |
          npm install -g @angular/cli@21
          ng version

      - name: Start Backend API
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          echo "Starting backend..."
          taskkill /f /im dotnet.exe 2>$null
          Start-Sleep -Seconds 2
          Start-Process -NoNewWindow -FilePath "dotnet" -ArgumentList "POS.Web.dll" -RedirectStandardOutput "backend.log" -RedirectStandardError "backend_error.log"
          
          for ($i = 1; $i -le 30; $i++) {
            $listening = netstat -an | findstr ":5000" | findstr "LISTENING"
            if ($listening) {
              echo "✅ Backend is listening on port 5000!"
              break
            }
            echo "Waiting for backend... ($i/30)"
            Start-Sleep -Seconds 2
          }

      - name: Install Angular Dependencies with Fixes
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Installing Angular dependencies with fixes..."
          
          # تحديث TypeScript إلى إصدار متوافق مع Angular 21
          npm install --save-dev typescript@~5.9.0
          
          # تثبيت المكتبات المفقودة
          npm install --save @angular/material@^21.0.0
          npm install --save font-awesome
          npm install --save @fortawesome/fontawesome-free
          npm install --save angular2-draggable@^1.5.0
          
          # تثبيت باقي dependencies
          npm install --legacy-peer-deps --no-audit --force
          echo "Dependencies installed successfully"

      - name: Fix SCSS and CSS Imports
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Fixing import paths..."
          
          # إصلاح استيرادات SCSS
          if (Test-Path "src/custom-theme.scss") {
            (Get-Content "src/custom-theme.scss") -replace "@import '~@angular/material/theming'", "@import '@angular/material/theming'" | Set-Content "src/custom-theme.scss"
            echo "Fixed custom-theme.scss"
          }
          
          # إصلاح استيرادات CSS
          if (Test-Path "src/assets/css/globalCss.css") {
            (Get-Content "src/assets/css/globalCss.css") -replace "~font-awesome", "font-awesome" | Set-Content "src/assets/css/globalCss.css"
            echo "Fixed globalCss.css"
          }

      - name: Build Angular Application
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "Building Angular application..."
          
          # البناء مع الاستمرار حتى مع الأخطاء
          ng build --configuration production --output-path=dist/POS --verbose
          
          # التحقق من نجاح البناء
          if (Test-Path "dist/POS/index.html") {
            echo "✅ Angular build completed - application is ready!"
          } else {
            echo "❌ Angular build failed - no index.html found"
            exit 1
          }

      - name: Install Serve and Start Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm install -g serve
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "serve", "-s", "dist/POS", "-l", "4200"
          Start-Sleep -Seconds 5

      - name: Checkout E2E Project
        run: |
          git clone https://github.com/teamtester60-code/Full-Test-Case.git projectB

      - name: Run E2E Tests
        working-directory: projectB
        env:
          BACKEND_BASE_URL: http://localhost:5000
          FRONTEND_BASE_URL: http://localhost:4200
        run: |
          mvn clean test -DbrowserType="chrome" -DexecutionType="local" -Dmaven.test.failure.ignore=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            projectB/test-output/reports/**/*
            ${{ env.BACKEND_DIR }}/backend.log
            ${{ env.FRONTEND_DIR }}/dist/POS/
          retention-days: 30